<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Text to Voice Indonesia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #38bdf8;
    }

    .notice {
      font-size: 0.8rem;
      color: #94a3b8;
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 0.75rem;
      color: #f8fafc;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, select:focus {
      border-color: #38bdf8;
    }

    select {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 0.75rem;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button {
      padding: 0.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-play {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-pause {
      background-color: #334155;
      color: #f8fafc;
    }

    .btn-stop {
      background-color: #ef4444;
      color: #ffffff;
    }

    @media (max-width: 480px) {
      .slider-grid, .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <header>
      <h1>Text to Voice Indonesia</h1>
    </header>

    <div class="notice">
      Buka file ini di <strong>Microsoft Edge</strong> agar suara <strong>Ardi (Pria)</strong> dan <strong>Gadis (Wanita)</strong> kualitas natural AI langsung aktif otomatis tanpa perlu key.
    </div>

    <div class="form-group">
      <label for="text-input">Naskah Kalimat</label>
      <textarea id="text-input" placeholder="Tuliskan naskah atau kata-kata yang ingin disuarakan di sini..."></textarea>
    </div>

    <div class="form-group">
      <label for="voice-select">Pilihan Suara & Karakter</label>
      <select id="voice-select">
        <option value="">Memuat daftar suara...</option>
      </select>
    </div>

    <div class="slider-grid">
      <div class="form-group">
        <label for="rate">Kecepatan: <span id="rate-val">1.0</span>x</label>
        <input type="range" id="rate" min="0.6" max="1.5" value="1.0" step="0.05">
      </div>
      <div class="form-group">
        <label for="pitch">Nada (Pitch): <span id="pitch-val">1.0</span></label>
        <input type="range" id="pitch" min="0.7" max="1.3" value="1.0" step="0.05">
      </div>
    </div>

    <div class="controls">
      <button id="btn-play" class="btn-play">Mulai Bicara</button>
      <button id="btn-pause" class="btn-pause">Pause</button>
      <button id="btn-stop" class="btn-stop">Stop</button>
    </div>
  </main>

  <script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const rateInput = document.getElementById('rate');
    const pitchInput = document.getElementById('pitch');
    const rateVal = document.getElementById('rate-val');
    const pitchVal = document.getElementById('pitch-val');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');

    let voices = [];

    const formatVoiceName = (voice) => {
      const name = voice.name;
      if (name.includes('Gadis')) return 'Gadis (Wanita - Natural AI)';
      if (name.includes('Ardi')) return 'Ardi (Pria - Natural AI)';
      if (name.includes('Google') && voice.lang.startsWith('id')) return 'Google Indonesia (Wanita)';
      return `${name} (${voice.lang})`;
    };

    const populateVoiceList = () => {
      voices = synth.getVoices();
      if (!voices.length) return;

      voiceSelect.innerHTML = '';

      // Prioritaskan suara Indonesia
      const idVoices = voices.filter(v => v.lang.includes('id') || v.lang.includes('ID'));
      const otherVoices = voices.filter(v => !v.lang.includes('id') && !v.lang.includes('ID'));

      const sortedVoices = [...idVoices, ...otherVoices];

      sortedVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = formatVoiceName(voice);
        voiceSelect.appendChild(option);
      });

      // Pilih otomatis Gadis atau Ardi jika ada
      const naturalVoice = sortedVoices.find(v => v.name.includes('Gadis') || v.name.includes('Ardi'));
      if (naturalVoice) {
        voiceSelect.value = naturalVoice.voiceURI;
      }
    };

    populateVoiceList();
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = populateVoiceList;
    }

    rateInput.addEventListener('input', (e) => {
      rateVal.textContent = e.target.value;
    });

    pitchInput.addEventListener('input', (e) => {
      pitchVal.textContent = e.target.value;
    });

    const speak = () => {
      if (synth.speaking) {
        if (synth.paused) {
          synth.resume();
          btnPause.textContent = 'Pause';
          return;
        }
        synth.cancel();
      }

      const text = textInput.value.trim();
      if (!text) {
        alert('Tuliskan teks terlebih dahulu.');
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      const selectedURI = voiceSelect.value;
      const matchedVoice = voices.find(v => v.voiceURI === selectedURI);

      if (matchedVoice) {
        utterance.voice = matchedVoice;
      }

      utterance.rate = parseFloat(rateInput.value);
      utterance.pitch = parseFloat(pitchInput.value);

      utterance.onend = () => {
        btnPlay.textContent = 'Mulai Bicara';
        btnPause.textContent = 'Pause';
      };

      utterance.onerror = () => {
        btnPlay.textContent = 'Mulai Bicara';
      };

      synth.speak(utterance);
      btnPlay.textContent = 'Ulangi';
      btnPause.textContent = 'Pause';
    };

    btnPlay.addEventListener('click', speak);

    btnPause.addEventListener('click', () => {
      if (!synth.speaking) return;

      if (synth.paused) {
        synth.resume();
        btnPause.textContent = 'Pause';
      } else {
        synth.pause();
        btnPause.textContent = 'Lanjut';
      }
    });

    btnStop.addEventListener('click', () => {
      synth.cancel();
      btnPlay.textContent = 'Mulai Bicara';
      btnPause.textContent = 'Pause';
    });
  </script>
</body>
</html>
